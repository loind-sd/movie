apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: movie-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/loind-sd/movie.git'
    targetRevision: main
    path: helm
    helm:
      valueFiles:
        - values-gateway.yaml # ArgoCD sẽ chỉ dùng file này cài đè lên các template
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
