{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "microservice.fullname" . }}-role
  labels:
    {{- include "auth-service-helm.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "microservice.fullname" . }}-rolebinding
  labels:
    {{- include "auth-service-helm.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "auth-service-helm.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "microservice.fullname" . }}-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}