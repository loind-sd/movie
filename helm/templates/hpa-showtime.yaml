{{- if .Values.showtimeHpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: showtime-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: showtime-service
  minReplicas: {{ .Values.showtimeHpa.minReplicas }}
  maxReplicas: {{ .Values.showtimeHpa.maxReplicas }}
  metrics:
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "{{ .Values.showtimeHpa.targetRPS }}"
{{- end }}