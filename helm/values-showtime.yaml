nameOverride: showtime-service
fullnameOverride: showtime-service

resources:
  requests:
    cpu: 100m        # tối thiểu cần 10% core
    memory: 256Mi    # tối thiểu 256MB RAM
  limits:
    cpu: 500m        # tối đa nửa core
    memory: 512Mi    # tối đa 512MB RAM — vượt là bị kill

image:
  repository: loind/showtime-service
  tag: "1.5"

service:
  type: ClusterIP
  port: 8084
  targetPort: 8084

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/actuator/prometheus"
  prometheus.io/port: "8084"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8084
  initialDelaySeconds: 40

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8084
  initialDelaySeconds: 30

container:
  port: 8084

# ================================
# OVERRIDE CẤU HÌNH CHO PROD
# ================================
configMap:
  enabled: true
  springProfile: "prod"
  database:
    # ⚠️ THAY IP NÀY BẰNG IP IPv4 CỦA MÁY TÍNH BẠN (VD: 192.168.1.10)
    # Nếu DB cài trực tiếp trên máy host thì K8s sẽ đi xuyên qua IP mạng LAN.
    url: "jdbc:postgresql://10.30.101.116:5432/movie"
    driverClassName: "org.postgresql.Driver"
  redis:
    # ⚠️ THAY IP NÀY BẰNG IP IPv4 CỦA MÁY TÍNH BẠN (VD: 192.168.1.10)
    host: "10.30.101.116"
  custom:
    # Vì file gốc bạn dùng config properties "cinema.kafka.bootstrap-servers"
    # thay vì "spring.kafka...", ta cần override biến này.
    CINEMA_KAFKA_BOOTSTRAP_SERVERS: "10.30.101.116:9092"

secret:
  enabled: true
  database:
    username: "postgres"
    password: "123456" # Mật khẩu của postgres
