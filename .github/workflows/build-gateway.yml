name: Build and Deploy Gateway

# Chỉ chạy quy trình này khi có code được push vào thư mục gateway/ hoặc file cấu hình của nó
on:
  push:
    branches:
      - main
    paths:
      - 'gateway/**'
      - '.github/workflows/build-gateway.yml'

env:
  IMAGE_NAME: loind/gateway-service

jobs:
  build-and-update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Quan trọng để có thể push code ngược lại

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set short git commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }},${{ env.IMAGE_NAME }}:latest

      # Bước quan trọng: Cập nhật file values-gateway.yaml cho ArgoCD
      - name: Update values.yaml
        run: |
          cd helm
          # Giả sử trong values-gateway.yaml bạn có cấu trúc:
          # image:
          #   repository: ten-dockerhub-cua-ban/gateway
          #   tag: "old-tag"
          
          # Dùng sed để replace dòng tag cũ thành tag mới (commit sha)
          sed -i 's/tag: .*/tag: "${{ steps.vars.outputs.sha_short }}"/g' values-gateway.yaml
          
          # Hiển thị ra để kiểm tra
          cat values-gateway.yaml | grep tag

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/values-gateway.yaml
          git commit -m "[Bot] Update gateway image tag to ${{ steps.vars.outputs.sha_short }}"
          git push origin main
