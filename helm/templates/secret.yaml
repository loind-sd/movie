{{- if .Values.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "microservice.fullname" . }}-secret
  labels:
    {{- include "auth-service-helm.labels" . | nindent 4 }}
type: Opaque
data:
  # Database credentials
  {{- if .Values.secret.database }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.secret.database.username | b64enc | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.secret.database.password | b64enc | quote }}
  {{- end }}
  
  # JWT/Authentication secrets
  {{- if .Values.secret.jwt }}
  JWT_SECRET_KEY: {{ .Values.secret.jwt.secretKey | b64enc | quote }}
  {{- if .Values.secret.jwt.expirationMs }}
  JWT_EXPIRATION_MS: {{ .Values.secret.jwt.expirationMs | toString | b64enc | quote }}
  {{- end }}
  {{- end }}
  
  # Redis credentials (if authentication enabled)
  {{- if .Values.secret.redis }}
  {{- if .Values.secret.redis.password }}
  SPRING_REDIS_PASSWORD: {{ .Values.secret.redis.password | b64enc | quote }}
  {{- end }}
  {{- end }}
  
  # Kafka credentials (if SASL enabled)
  {{- if .Values.secret.kafka }}
  {{- if .Values.secret.kafka.username }}
  SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: {{ printf "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"%s\" password=\"%s\";" .Values.secret.kafka.username .Values.secret.kafka.password | b64enc | quote }}
  {{- end }}
  {{- end }}
  
  # Third-party API keys
  {{- if .Values.secret.apiKeys }}
  {{- range $key, $value := .Values.secret.apiKeys }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
  {{- end }}
  
  # Custom secrets
  {{- range $key, $value := .Values.secret.custom }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}

---
{{- end }}
{{- if .Values.externalSecret.enabled }}
# ExternalSecret for production (uses External Secrets Operator)
# This is preferred for production as secrets are fetched from external vault
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "microservice.fullname" . }}-external-secret
  labels:
    {{- include "auth-service-helm.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "microservice.fullname" . }}-secret
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecret.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
        {{- if .property }}
        property: {{ .property }}
        {{- end }}
    {{- end }}
{{- end }}
